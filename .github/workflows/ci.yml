name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]


jobs:
  # Code formatting check
  fmt:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go environment
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Check code formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files have incorrect formatting:"
          gofmt -s -d .
          exit 1
        fi

  # Code static analysis
  vet:
    name: Code Static Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go environment
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Run go vet
      run: go vet ./...

  # Code testing
  test:
    name: Code Testing
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go environment
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Remove stale generated report evidence
      id: report_cleanup
      if: '!cancelled()'
      shell: bash
      run: |
        set -euo pipefail
        test ! -L .github
        rm -f -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
        rm -rf -- .github/test-results
    - name: Test, race and coverage (GTR v1.1.2)
      id: go_test_report
      uses: soulteary/go-test-report-action@bf04b539f7bf2a6f67d602da4259904b3dcdeba1
      with:
        directory: .
        packages: ./...
        race: 'true'
        cover_mode: atomic
        coverage_threshold: '0'
        test_args: -v
        version: v1.1.2
        commit: 'false'
    - name: Go quality report (v1.1.3)
      id: go_report_card
      if: "!cancelled() && steps.report_cleanup.outcome == 'success'"
      uses: soulteary/goreportcard-action@fc43049a5fe61c3313294d217c2a783f375a7970
      with:
        directory: .
        version: v1.1.3
        threshold: '0'
        report: 'true'
        commit: 'false'
    - name: Preserve report evidence
      if: always() && steps.report_cleanup.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: go-quality-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
        path: |
          .github/go-test-report.md
          .github/go-test-report.json
          .github/coverage.svg
          .github/goreportcard.svg
          .github/goreportcard-report.md
          .github/test-results/
        include-hidden-files: true
        retention-days: 14
    - name: Reuse GTR coverage profile
      run: cp .github/test-results/coverage.out coverage.out
    - name: Display coverage summary
      run: go tool cover -func=coverage.out

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go environment
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --timeout=5m
        only-new-issues: false

  # Dependency security scan
  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go environment
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run security scan
      run: govulncheck ./...
